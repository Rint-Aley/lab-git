<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small people management application">
  <title>People Management</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">DIRECTORY</p>
      <h1>People Management</h1>
      <p class="subtitle">Keep your people records in one simple place.</p>
    </header>

    <section class="panel form-panel" aria-labelledby="add-person-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">NEW RECORD</p>
          <h2 id="add-person-heading">Add a person</h2>
        </div>
      </div>
      <form id="person-form" novalidate>
        <div class="form-fields">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" maxlength="100" autocomplete="name" placeholder="e.g. Ada Lovelace" required>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="ada@example.com" required>
          </div>
          <button id="submit-button" class="button button-primary" type="submit">Add person</button>
        </div>
        <p id="form-message" class="message" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel directory-panel" aria-labelledby="people-heading">
      <div class="directory-heading">
        <div>
          <p class="eyebrow">YOUR DIRECTORY</p>
          <h2 id="people-heading">People</h2>
        </div>
        <span id="people-count" class="count-badge">0 records</span>
      </div>
      <p id="status-message" class="status-message" role="status" aria-live="polite">Loading people…</p>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Created</th>
              <th scope="col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="people-body">
            <tr><td class="table-message" colspan="4">Loading people…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <footer class="page-footer">A small learning project built with FastAPI, SQLite and vanilla JavaScript.</footer>
  </main>
</body>
</html>
